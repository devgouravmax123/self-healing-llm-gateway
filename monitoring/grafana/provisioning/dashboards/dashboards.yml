# Grafana Dashboard Provisioning Configuration
# Automatically discovers and registers JSON dashboard files from disk.

apiVersion: 1

providers:
  - name: "LLM Gateway Dashboards"
    orgId: 1
    folder: "LLM Gateway"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
