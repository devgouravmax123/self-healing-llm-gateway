# Prometheus Configuration for Self-Healing LLM Gateway
# Scrapes the application's /metrics endpoint.
#
# Target 'gateway:8000' resolves across the private Docker network in Docker Compose.
# For standalone host development, Prometheus can be overridden to 'localhost:8000'.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway:8000"
        labels:
          app: "self-healing-llm-gateway"
          env: "development"
