# Prometheus Configuration for Self-Healing LLM Gateway
# Scrapes the application's /metrics endpoint.
#
# NOTE FOR PHASE 17 DOCKER COMPOSE:
# In the containerized stack, change the target to 'gateway:8000'.
# For local host development, 'localhost:8000' or 'host.docker.internal:8000' is used.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "localhost:8000"
        labels:
          app: "self-healing-llm-gateway"
          env: "development"
